<!doctype html>
<html lang="en">
  <head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enroll Student</title>
  </head>
  <body>
    {% include "_nav.html" %}
    <h1>Enroll Student</h1>
    <p>Course: {{ course.code }} — {{ course.title }}</p>

    <form method="post">
      {% csrf_token %} {{ form.non_field_errors }}

      <p>
        <label for="{{ form.student.id_for_label }}">Student:</label>
        {{ form.student }} {{ form.student.errors }}
      </p>

      <button type="submit">Enroll</button>
    </form>

    <p>
      <a href="{% url 'course-roster' course.id %}">Back to roster</a>
    </p>
  </body>
</html>
