<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>My Courses</title>
  </head>
  <body>
    <h1>My Courses</h1>

    {% if courses %}
    <ul>
      {% for course in courses %}
      <li>
        <strong>{{ course.code }}</strong> — {{ course.title }} (Semester {{
        course.semester }}) {% if course.archived %}
        <span>Archived</span>
        {% else %}
        <span>Active</span>
        {% endif %}

        <a href="{% url 'course-roster' course.id %}"> View roster </a>
      </li>
      {% endfor %}
    </ul>
    {% else %}
    <p>You are not assigned to any courses.</p>
    {% endif %}
  </body>
</html>
