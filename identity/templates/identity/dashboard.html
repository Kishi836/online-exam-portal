<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dashboard</title>
  </head>
  <body>
    <p>Signed in as {{ user.email }} ({{ user.get_role_display }}).</p>

    {% if user.role == "STUDENT" %}
    <p><a href="{% url 'student-exam-list' %}">View Available Exams</a></p>
    {% endif %}

    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit">Sign out</button>
    </form>
  </body>
</html>
