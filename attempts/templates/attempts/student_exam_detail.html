<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{ exam.title }}</title>
  </head>
  <body>
    <h1>{{ exam.title }}</h1>

    <p>
      <strong>Course:</strong> {{ exam.course.code }} — {{ exam.course.title }}
    </p>
    <p><strong>Duration:</strong> {{ exam.duration_minutes }} minutes</p>
    <p><strong>Total marks:</strong> {{ exam.total_marks }}</p>
    <p><strong>Pass mark:</strong> {{ exam.pass_mark_percent }}%</p>
    <p><strong>Instructions:</strong> {{ exam.instructions|default:"None" }}</p>

    <form method="post" action="{% url 'attempt-start' %}">
      {% csrf_token %}
      <input type="hidden" name="exam" value="{{ exam.pk }}" />
      <button type="submit">Start exam</button>
    </form>

    <p><a href="{% url 'student-exam-list' %}">Back to available exams</a></p>
  </body>
</html>
